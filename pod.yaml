apiVersion: v1
kind: Pod
metadata:
  name: python-dev
  labels:
    app: python-dev
spec:
  containers:
    - name: python
      image: python:3.14-slim
      command:
        - sh
        - -c
        - |
          apt-get update \
            && apt-get install -y --no-install-recommends fish git \
            && rm -rf /var/lib/apt/lists/*
          exec sleep infinity
      workingDir: /workspace
      stdin: true
      tty: true
      env:
        - name: SHELL
          value: /usr/bin/fish
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 2Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      hostPath:
        path: /mnt/workspace
        type: Directory